## Apps and hardware keys
##
##   A line starting with "#:" describes the binding below it; the Keys list
##   (Mod+Shift+Space) shows that text. Keep one above every bindsym.

##-- Launchers -----------------------------

#: App launcher
bindsym $mod+space exec wofi --show drun
#: Window switcher
bindsym $mod+Tab exec ~/.config/sway/scripts/windows
#: This list of keys
bindsym $mod+Shift+space exec ~/.config/sway/scripts/keys
#: Clipboard history
bindsym $mod+v exec ~/.config/sway/scripts/clipboard

#: Terminal
bindsym $mod+t exec foot
#: Terminal
bindsym $mod+Return exec foot
#: Drop-down terminal
bindsym $mod+q exec ~/.config/sway/scripts/dropdown
#: File manager
bindsym $mod+e exec dolphin
#: Browser (focus or start)
bindsym $mod+b exec ~/.config/sway/scripts/focus-or-launch --browser
#: System monitor (htop)
bindsym $mod+Shift+Escape exec foot --app-id foot-float htop

##-- Screenshots ---------------------------

#: Screenshot an area (capture)
bindsym $mod+c exec ~/.config/sway/scripts/screenshot area
#: Screenshot an area
bindsym Print exec ~/.config/sway/scripts/screenshot area
#: Screenshot the focused window
bindsym $mod+Ctrl+c exec ~/.config/sway/scripts/screenshot window
#: Screenshot the whole screen
bindsym Shift+Print exec ~/.config/sway/scripts/screenshot full

##-- Session -------------------------------

#: Lock the screen
bindsym $mod+Shift+x exec ~/.config/sway/scripts/lock-now
#: Session menu (power, reload, restart)
bindsym $mod+Shift+e exec ~/.config/sway/scripts/powermenu
#: Pomodoro: start, pause, resume
bindsym $mod+Shift+z exec ~/.config/sway/scripts/pomo toggle
#: Theme picker
bindsym $mod+Shift+t exec ~/.config/sway/scripts/theme
#: Show window app_id and class (for rules)
bindsym $mod+Shift+i exec ~/.config/sway/scripts/winfo

##-- Volume and brightness, one step -------

#: Volume up
bindsym $mod+Ctrl+w exec pactl set-sink-volume @DEFAULT_SINK@ +5% && ~/.config/sway/scripts/sound volume
#: Volume down
bindsym $mod+Ctrl+s exec pactl set-sink-volume @DEFAULT_SINK@ -5% && ~/.config/sway/scripts/sound volume
#: Mute
bindsym $mod+Ctrl+x exec pactl set-sink-mute @DEFAULT_SINK@ toggle
#: Brightness up
bindsym $mod+Ctrl+d exec ~/.config/sway/scripts/brightness up
#: Brightness down
bindsym $mod+Ctrl+a exec ~/.config/sway/scripts/brightness down

##-- Adjust mode ---------------------------

## Everything a 60% keyboard has no key for. Nothing is held down inside it.
#: Adjust: volume, brightness, media
bindsym $mod+g mode "adjust"

mode "adjust" {
        #: Volume up
        bindsym w exec pactl set-sink-volume @DEFAULT_SINK@ +5% && ~/.config/sway/scripts/sound volume
        #: Volume down
        bindsym s exec pactl set-sink-volume @DEFAULT_SINK@ -5% && ~/.config/sway/scripts/sound volume
        #: Mute
        bindsym x exec pactl set-sink-mute @DEFAULT_SINK@ toggle
        #: Brightness up
        bindsym d exec ~/.config/sway/scripts/brightness up
        #: Brightness down
        bindsym a exec ~/.config/sway/scripts/brightness down
        #: Previous track
        bindsym q exec playerctl previous
        #: Next track
        bindsym e exec playerctl next
        #: Play / pause
        bindsym space exec playerctl play-pause
        #: Event sounds on / off
        bindsym z exec ~/.config/sway/scripts/sound toggle

        #: Leave adjust mode
        bindsym Escape mode "default"
        #: Leave adjust mode
        bindsym g mode "default"
        #: Leave adjust mode
        bindsym Return mode "default"
}

##-- Media keys (full-size keyboards) ------

## --locked: these also work on the lock screen
#: Volume up
bindsym --locked XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5% && ~/.config/sway/scripts/sound volume
#: Volume down
bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5% && ~/.config/sway/scripts/sound volume
#: Mute
bindsym --locked XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
#: Mute the microphone
bindsym --locked XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle
#: Play / pause
bindsym --locked XF86AudioPlay exec playerctl play-pause
#: Play / pause
bindsym --locked XF86AudioPause exec playerctl play-pause
#: Next track
bindsym --locked XF86AudioNext exec playerctl next
#: Previous track
bindsym --locked XF86AudioPrev exec playerctl previous
#: Stop playback
bindsym --locked XF86AudioStop exec playerctl stop
#: Brightness up
bindsym XF86MonBrightnessUp exec ~/.config/sway/scripts/brightness up
#: Brightness down
bindsym XF86MonBrightnessDown exec ~/.config/sway/scripts/brightness down

##-- Game mode -----------------------------

## Notifications and idle lock off; sway keys off except these. A fullscreen
## game is scanned out directly, may tear and gets VRR without any of this.
#: Game mode on
bindsym $mod+Shift+g exec ~/.config/sway/scripts/gamemode on

mode "game" {
        #: Game mode off
        bindsym $mod+Shift+g exec ~/.config/sway/scripts/gamemode off
        #: Workspace 1
        bindsym $mod+1 workspace number 1
        #: Workspace 2
        bindsym $mod+2 workspace number 2
        #: Workspace 3
        bindsym $mod+3 workspace number 3
        #: Workspace 4
        bindsym $mod+4 workspace number 4
        #: Workspace 5
        bindsym $mod+5 workspace number 5
        #: Workspace 6
        bindsym $mod+6 workspace number 6
        #: Workspace 7
        bindsym $mod+7 workspace number 7
        #: Workspace 8
        bindsym $mod+8 workspace number 8
        #: Workspace 9
        bindsym $mod+9 workspace number 9
        #: Workspace 10
        bindsym $mod+0 workspace number 10
}

##-- Pomodoro break ------------------------

## scripts/break-screen puts sway in this mode; the only live key skips the break
mode "break" {
        #: Skip the break
        bindsym $mod+Ctrl+Shift+b exec ~/.config/sway/scripts/pomo skip
}
