## Hardware: outputs and inputs. Replaces i3's xorg/ snippets and the xrandr
## and setxkbmap scripts. No output or device name is hardcoded.

##-- Outputs -------------------------------

## Variable refresh rate (FreeSync) on every output that supports it. The
## preferred output modes are used by default. Run scripts/display manually
## if you want the largest mode at its highest refresh rate.
# output * adaptive_sync on

##-- Keyboard ------------------------------

## Mod is the physical Super key. Uncomment the optional v2 swap below
## to place Super on the left Alt key; Plasma keeps its own keyboard layout.
input type:keyboard {
    # Optional v2 layout: xkb_options altwin:swap_lalt_lwin
    repeat_delay 300
    repeat_rate 40
}

##-- Mouse ---------------------------------

## Flat acceleration profile (was xorg/40-libinput.conf)
input type:pointer {
    accel_profile flat
    pointer_accel 0
}

## The launcher supplies KDE's saved cursor theme and size through a runtime
## include. sway-local.conf can override it without changing KDE settings.

##-- X11 apps ------------------------------

## XWayland stays on for Steam, games and Electron builds without Wayland support
xwayland enable
