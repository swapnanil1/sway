## Hardware: outputs and inputs. Replaces i3's xorg/ snippets and the xrandr
## and setxkbmap scripts. No output or device name is hardcoded.

##-- Outputs -------------------------------

## Variable refresh rate (FreeSync) on every output that supports it. The
## resolution and refresh rate are set by scripts/display: the largest mode at
## its highest rate, on every connected output.
output * adaptive_sync on

##-- Keyboard ------------------------------

## Mod is Super. The swap puts Super under the left thumb (where Alt is printed)
## and Alt on the key beside it. Delete the altwin option to keep the keys as
## printed. Unlike setxkbmap on X11 this also applies to keyboards plugged in
## later, so no USB watcher is needed for it.
input type:keyboard {
    xkb_options altwin:swap_lalt_lwin
    repeat_delay 300
    repeat_rate 40
}

##-- Mouse ---------------------------------

## Flat acceleration profile (was xorg/40-libinput.conf)
input type:pointer {
    accel_profile flat
    pointer_accel 0
}

## Cursor theme and size, matching the GTK and Qt seeds
seat * xcursor_theme breeze_cursors 24

##-- X11 apps ------------------------------

## XWayland stays on for Steam, games and Electron builds without Wayland support
xwayland enable
