## Theme

##-- Variables -----------------------------

set $sway_font JetBrainsMono Nerd Font 13

set $sway_border_size 2
set $sway_border_style pixel

set $sway_gaps_inner 10
set $sway_gaps_outer 0
# on: a lone window fills the screen, gaps appear once there are two
set $sway_gaps_smart on

## Colours ($col_*) are set in 00_colors.conf, written by scripts/theme

##-- Font ----------------------------------

font pango:$sway_font

##-- Borders -------------------------------

default_border $sway_border_style $sway_border_size
default_floating_border $sway_border_style $sway_border_size

## Client-side-decorated apps (GTK headerbars) ask for no border, which leaves
## them without a focus colour. Force it on everything.
for_window [all] border $sway_border_style $sway_border_size

## No border either when a window is alone on its workspace
hide_edge_borders smart_no_gaps

##-- Gaps ----------------------------------

gaps inner $sway_gaps_inner
gaps outer $sway_gaps_outer
smart_gaps $sway_gaps_smart

##-- Colors --------------------------------

## Only the focused window is bright. The indicator (split direction hint)
## matches its border: autotiling picks the direction, so it needs no emphasis.
# class                  border       backgr.      text     indicator    child_border
client.focused           $col_focus   $col_focus   $col_bg  $col_focus   $col_focus
client.focused_inactive  $col_unfoc   $col_unfoc   $col_fg  $col_unfoc   $col_unfoc
client.unfocused         $col_unfoc   $col_unfoc   $col_fg  $col_unfoc   $col_unfoc
client.urgent            $col_urgent  $col_urgent  $col_fg  $col_urgent  $col_urgent
client.placeholder       $col_phol    $col_phol    $col_fg  $col_phol    $col_phol
client.background        $col_bg
