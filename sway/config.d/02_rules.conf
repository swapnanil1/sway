## Rules
## Native Wayland windows match on app_id, XWayland windows (Steam, games, old
## Electron builds) on class. Mod+Shift+I shows both for the focused window.
## Patterns are case-insensitive so native, Flatpak and renamed builds match.

##-- Workspace Rules ------------------------

assign [app_id="(?i)firefox|librewolf|zen|brave|chromium"] 1
assign [class="(?i)brave|firefox|chromium|librewolf|zen"] 1
assign [app_id="(?i)^code|vscodium|antigravity|jetbrains|zed"] 2
assign [class="(?i)^code|vscodium|antigravity|jetbrains|^zed"] 2
assign [class="^steam_app_|^steam_proton$|(?i)lutris|gamescope"] 5
assign [app_id="(?i)lutris|gamescope"] 5
## Everything the launchers spawn belongs with the games: Proton's own windows
## (steam_proton: the Rockstar, EA and Ubisoft launchers, installers,
## redistributables) and anything Wine draws for Heroic, Epic or Lutris, whose
## class is the .exe name
assign [class="(?i)\.exe$"] 5
## the launchers: Steam, Heroic and the official Epic Games Launcher (AppImage,
## app_id EpicGamesLauncher). Games they start go to 5.
assign [class="(?i)^steam$|heroic|epicgameslauncher"] 6
assign [app_id="(?i)heroic|epicgameslauncher"] 6
## Winetricks and Protontricks draw their dialogs with zenity or yad; the title
## tells them apart from other zenity dialogs. for_window: the title arrives
## after the window maps.
for_window [app_id="(?i)^(zenity|yad)$" title="(?i)^(winetricks|protontricks)"] move to workspace 6
for_window [class="(?i)^(zenity|yad)$" title="(?i)^(winetricks|protontricks)"] move to workspace 6
## the mixer is not here on purpose: the bar opens it, so it floats where you are
assign [app_id="(?i)nwg-look|qt6ct"] 8

## These set their id after the window maps (Spotify) or restore late, so
## `assign` would miss them; for_window re-checks when it changes.
for_window [app_id="(?i)discord|vesktop|spotify|obsproject"] move to workspace 7
for_window [class="(?i)discord|vesktop|spotify|^obs$"] move to workspace 7
## Easy Effects is the equaliser for the music there
assign [app_id="(?i)easyeffects"] 7

##-- Window Rules ---------------------------

for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [app_id="foot-float"] floating enable, resize set 1000 700, move position center
for_window [app_id="(?i)nwg-look|qt6ct"] floating enable
for_window [app_id="(?i)pavucontrol|nm-connection-editor"] floating enable, resize set 800 600, move position center
for_window [app_id="(?i)^mpv$|gimp|^ark$|kcalc"] floating enable
for_window [class="(?i)gimp|mpv"] floating enable

## DroidCam's control window (phone as webcam) is a small dialog
for_window [app_id="(?i)droidcam"] floating enable
for_window [class="(?i)droidcam"] floating enable

## DaVinci Resolve (XWayland): no border; its dialogs float as X11 transients
for_window [class="(?i)^resolve$"] border none

## The polkit password prompt has no parent window, so sway would tile it
for_window [app_id="(?i)polkit-kde-authentication-agent"] floating enable, move position center
for_window [class="(?i)polkit"] floating enable, move position center

## Drop-down terminal lives on the scratchpad
for_window [app_id="dropdown"] floating enable, resize set 1400 700, move scratchpad, sticky enable

##-- Games ----------------------------------

## Games get no border and may tear (lowest latency); every Steam window except
## the main one floats
for_window [class="^steam_app_|(?i)gamescope"] border none, allow_tearing yes
for_window [app_id="(?i)gamescope"] border none, allow_tearing yes
for_window [class="(?i)^steam$" title="^(?!Steam$).+"] floating enable

##-- Pomodoro break -------------------------

for_window [app_id="break-screen"] fullscreen enable global, border none

##-- Idle -----------------------------------

## A fullscreen window (video, game) keeps the screen from locking
for_window [all] inhibit_idle fullscreen
