# Installed as sway-portals.conf: KDE keeps its distribution portal settings.
[preferred]
default=gtk
# Share Plasma's appearance preferences and native file picker. These do not
# require the Plasma shell. Compositor-specific capture stays on wlroots.
org.freedesktop.impl.portal.Settings=kde
org.freedesktop.impl.portal.FileChooser=kde
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
