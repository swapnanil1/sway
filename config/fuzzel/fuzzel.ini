# fuzzel: launcher and every menu (bin/menu, bin/keys, bin/theme, bin/clipboard).
# Colours are generated by bin/theme.
include=~/.cache/sway-desktop/fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=12
icon-theme=Papirus-Dark
lines=12
width=48
horizontal-pad=20
vertical-pad=16
inner-pad=10
prompt="  "
match-mode=fuzzy
terminal=foot -e
layer=overlay

[border]
width=2
radius=12
