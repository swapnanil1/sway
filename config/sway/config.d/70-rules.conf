# Window rules. Native Wayland windows have an app_id, XWayland ones a class;
# `bin/window-info` (Mod+Shift+I) shows which one a window has.

##-- Workspaces by purpose -----------------

assign [app_id="(?i)firefox|brave|chromium|librewolf|zen"] 1
assign [class="(?i)firefox|brave|chromium|librewolf|zen"]  1
assign [app_id="(?i)^code|codium|antigravity|jetbrains|^zed"] 2
assign [class="(?i)^code|codium|antigravity|jetbrains|^zed"]  2
assign [class="^steam_app_|(?i)lutris|heroic"] 5
assign [app_id="(?i)gamescope|lutris|heroic"]  5
assign [class="(?i)^steam$"] 6
for_window [class="(?i)discord|vesktop|spotify|^obs$"]  move to workspace 7
for_window [app_id="(?i)discord|vesktop|spotify|obs"]    move to workspace 7

##-- Floating ------------------------------

for_window [app_id="floating|dropdown|break-screen"] floating enable
for_window [app_id="(?i)pavucontrol|nm-connection-editor|satty|xarchiver"] floating enable
for_window [window_role="pop-up|task_dialog|dialog"] floating enable
for_window [class="(?i)^steam$" title="^(?!Steam$).+"] floating enable

##-- Drop-down terminal and break screen ----

for_window [app_id="dropdown"] resize set 1400 700, move position center, move scratchpad, sticky enable
for_window [app_id="break-screen"] fullscreen enable global

##-- Games ---------------------------------

# No border, never idle-locked, and allowed to tear if the game asks for it
for_window [class="^steam_app_"] border none, inhibit_idle fullscreen, allow_tearing yes
for_window [app_id="(?i)gamescope"] border none, inhibit_idle fullscreen, allow_tearing yes

# Video and calls in any fullscreen window keep the screen awake
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"] inhibit_idle fullscreen
