# Input. These apply to every device, including ones plugged in later.

input type:keyboard {
    # add ",caps:swapescape" to also swap Caps Lock and Escape
    xkb_options altwin:swap_lalt_lwin
    repeat_delay 300
    repeat_rate 40
}

# No pointer acceleration anywhere: the cursor moves exactly as far as the
# hand does, at any speed. "flat" turns the acceleration curve off and
# pointer_accel 0 leaves the device's own speed untouched.
input type:pointer {
    accel_profile flat
    pointer_accel 0
}

input type:touchpad {
    accel_profile flat
    pointer_accel 0
    tap enabled
    natural_scroll enabled
    dwt enabled
}

# The pointer follows focus changes made from the keyboard
mouse_warping container
focus_follows_mouse yes
