# Outputs. Each one runs at its preferred mode; nothing is named here.

# FreeSync / VRR for fullscreen windows
output * adaptive_sync on

# Let fullscreen applications that ask for it present without vsync (lowest
# latency). Windows opt in through the rule in 70-rules.conf.
output * allow_tearing yes

# Background: bin/wallpaper uses an image if there is one, else the theme colour
exec_always $bin/wallpaper
