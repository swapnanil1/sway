# Appearance. Colours ($color_*) come from the active theme.

font pango:JetBrainsMono Nerd Font 11

default_border pixel 2
default_floating_border pixel 2
titlebar_padding 6 3

gaps inner 10
gaps outer 0
# A lone window fills the screen: no gaps, no border
smart_gaps on
smart_borders on

# Only the focused window is bright; the split indicator matches its border
# class                  border          background      text           indicator       child_border
client.focused           $color_accent   $color_accent   $color_bg      $color_accent   $color_accent
client.focused_inactive  $color_bg_alt   $color_bg_alt   $color_fg      $color_bg_alt   $color_bg_alt
client.unfocused         $color_bg_alt   $color_bg_alt   $color_fg_dim  $color_bg_alt   $color_bg_alt
client.urgent            $color_urgent   $color_urgent   $color_bg      $color_urgent   $color_urgent

seat * xcursor_theme Adwaita 24
