# template | file under ~/.cache/sway-desktop | reload command (optional)
#
# To theme another tool: add a template with ${KEY} placeholders (${KEY_HEX} is
# the same colour without the leading #), add a line here, and make the tool's
# config include the generated file.
env              | theme.env        | $BIN/wallpaper
sway.conf        | sway.conf        | swaymsg -q reload
waybar.css       | waybar.css       | pkill -USR2 -x waybar
fuzzel.ini       | fuzzel.ini       |
mako             | mako             | makoctl reload
foot.ini         | foot.ini         |
swaylock         | swaylock         |
fastfetch.jsonc  | fastfetch.jsonc  |
