# template | written to (relative to the repo) | reload command (optional)
#
# To theme another tool: add a template with ${BG}-style placeholders in
# templates/ (${BG_HEX} for tools that want no "#"), add a line here, and make
# that tool's config import the target. mako, swaylock, wofi and MangoHud take
# no include, so their whole config is the template.
env             | sway/theme.env               | ~/.config/sway/scripts/wallpaper
sway.conf       | sway/config.d/00_colors.conf | swaymsg -q reload
waybar.css      | waybar/colors.css            | pkill -USR2 -x waybar
wofi.css        | wofi/style.css               |
foot.ini        | foot/colors.ini              |
mako.conf       | mako/config                  | makoctl reload
swaylock.conf   | swaylock/config              |
fastfetch.jsonc | fastfetch/config.jsonc       |
# KDE apps read this through ~/.local/share/color-schemes/Sway.colors (a
# symlink install.sh makes); open windows keep their colours, new ones follow
kde.colors      | kde/Sway.colors              |
# Every Qt app, through ~/.config/qt6ct/colors/Sway.conf (also a symlink
# install.sh makes); the seeded qt6ct.conf selects it. New windows follow.
qt6ct.conf      | qt6ct/colors/Sway.conf       |
# MangoHud reads it when a game starts; a running game reloads with Shift_L+F4
mangohud.conf   | mangohud/MangoHud.conf       |
