# ${THEME_HEADER}
# MangoHud takes no include, so this template is the whole config: layout,
# keys and colours. Edit themes/templates/mangohud.conf, not
# ~/.config/MangoHud/MangoHud.conf. The views live in mangohud/presets.conf.
#
# Keys (60%-keyboard friendly: right Shift + the punctuation cluster beside it):
#   Shift_R + \   HUD on/off        Shift_R + ]   cycle view: fps / temps / compact / full / bench / power / everything / off
#   Shift_R + [   cycle fps cap 0 / 141 / 72          Shift_R + '   move HUD to next corner
#   Shift_R + ;   start/stop 60 s frametime log
#
# Colours follow the desktop palette: background and text from the theme,
# cyan GPU, green CPU, magenta VRAM, yellow RAM, dim grey for engine and wine,
# and the load/fps thresholds step through the theme's green, yellow and red.
# Docs: https://github.com/flightlessmango/MangoHud

## views (presets.conf), least to most detail: 1 fps, 2 temps, 3 compact,
## 4 full, 5 bench, 6 power, 7 everything, 0 off. A game starts with the
## first one listed.
preset=1,2,3,4,5,6,7,0
toggle_preset=Shift_R+bracketright

## ------------------------------------------------------------ look
legacy_layout=0
font_file=/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf
font_size=22
font_scale=1.0
text_outline=1
text_outline_thickness=2
text_outline_color=${BG_HEX}
round_corners=10
background_alpha=0.6
background_color=${BG_HEX}
text_color=${FG_HEX}
position=top-left
offset_x=12
offset_y=12
table_columns=3

## colours per block
gpu_color=${CYAN_HEX}
cpu_color=${GREEN_HEX}
vram_color=${MAGENTA_HEX}
ram_color=${YELLOW_HEX}
engine_color=${FG_DIM_HEX}
frametime_color=${CYAN_HEX}
wine_color=${FG_DIM_HEX}
io_color=${CYAN_HEX}

## thresholds (colour changes): flags, not HUD items
gpu_load_change
gpu_load_value=60,90
gpu_load_color=${CYAN_HEX},${YELLOW_HEX},${RED_HEX}
cpu_load_change
cpu_load_value=60,90
cpu_load_color=${GREEN_HEX},${YELLOW_HEX},${RED_HEX}
fps_color_change
fps_value=60,120
fps_color=${RED_HEX},${YELLOW_HEX},${GREEN_HEX}
time_format=%H:%M

## ------------------------------------------------------------ control
toggle_hud=Shift_R+backslash
toggle_hud_position=Shift_R+apostrophe
fps_limit=0,141,72              # 0 = uncapped; 141 keeps VRR engaged at 144 Hz; 72 = half rate
fps_limit_method=late           # lowest latency; use "early" if a game stutters with it
toggle_fps_limit=Shift_R+bracketleft
vsync=0
gl_vsync=-1

## logging (Shift_R+;): CSV in ~/Videos/mangohud-logs
toggle_logging=Shift_R+semicolon
output_folder=${HOME}/Videos/mangohud-logs
log_duration=60
log_interval=100
autostart_log=0
