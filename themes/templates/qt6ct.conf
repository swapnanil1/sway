# ${THEME_HEADER}
# qt6ct palette, so every Qt application (not only the KDE ones, which read
# kde.colors) uses the desktop palette. Without it qt6ct's bundled "darker"
# palette supplied the Qt roles the KDE scheme does not reach, and Dolphin's
# alternating rows came out grey. The 21 roles, in QPalette order:
#   WindowText Button Light Midlight Dark Mid Text BrightText ButtonText Base
#   Window Shadow Highlight HighlightedText Link LinkVisited AlternateBase
#   NoRole ToolTipBase ToolTipText PlaceholderText
[ColorScheme]
active_colors=#ff${FG_HEX}, #ff${BG_ALT_HEX}, #ff${SELECTION_HEX}, #ff${BG_ALT_HEX}, #ff${BG_HEX}, #ff${BLACK_HEX}, #ff${FG_HEX}, #ff${WHITE_HEX}, #ff${FG_HEX}, #ff${BG_HEX}, #ff${BG_ALT_HEX}, #ff${BG_HEX}, #ff${ACCENT_HEX}, #ff${BG_HEX}, #ff${BLUE_HEX}, #ff${MAGENTA_HEX}, #ff${BG_ALT_HEX}, #ff${FG_HEX}, #ff${BG_ALT_HEX}, #ff${FG_HEX}, #80${FG_HEX}
inactive_colors=#ff${FG_HEX}, #ff${BG_ALT_HEX}, #ff${SELECTION_HEX}, #ff${BG_ALT_HEX}, #ff${BG_HEX}, #ff${BLACK_HEX}, #ff${FG_HEX}, #ff${WHITE_HEX}, #ff${FG_HEX}, #ff${BG_HEX}, #ff${BG_ALT_HEX}, #ff${BG_HEX}, #ff${SELECTION_HEX}, #ff${FG_HEX}, #ff${BLUE_HEX}, #ff${MAGENTA_HEX}, #ff${BG_ALT_HEX}, #ff${FG_HEX}, #ff${BG_ALT_HEX}, #ff${FG_HEX}, #80${FG_HEX}
disabled_colors=#ff${FG_DIM_HEX}, #ff${BG_ALT_HEX}, #ff${SELECTION_HEX}, #ff${BG_ALT_HEX}, #ff${BG_HEX}, #ff${BLACK_HEX}, #ff${FG_DIM_HEX}, #ff${WHITE_HEX}, #ff${FG_DIM_HEX}, #ff${BG_HEX}, #ff${BG_ALT_HEX}, #ff${BG_HEX}, #ff${SELECTION_HEX}, #ff${FG_DIM_HEX}, #ff${BLUE_HEX}, #ff${MAGENTA_HEX}, #ff${BG_ALT_HEX}, #ff${FG_DIM_HEX}, #ff${BG_ALT_HEX}, #ff${FG_DIM_HEX}, #80${FG_DIM_HEX}
