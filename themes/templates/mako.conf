# ${THEME_HEADER}
# mako takes no include, so this template is the whole config: layout and
# colours. Edit themes/templates/mako.conf, not ~/.config/mako/config.

font=JetBrainsMono Nerd Font 11
anchor=top-right
outer-margin=10
margin=0,0,8,0
width=420
height=160
padding=10,12
border-size=2
border-radius=0
icons=1
max-icon-size=40
markup=1
format=<b>%s</b>\n%b
max-visible=5
sort=-time
group-by=app-name
default-timeout=5000
ignore-timeout=0
on-button-left=dismiss
on-button-middle=invoke-default-action
on-button-right=dismiss-all

background-color=${BG}
text-color=${FG}
border-color=${ACCENT}
progress-color=over ${ACCENT}

# Event sound per notification (scripts/sound decides whether it is audible)
on-notify=exec ~/.config/sway/scripts/sound notify

[urgency=low]
border-color=${BLACK}
default-timeout=2000
on-notify=none

[urgency=critical]
text-color=${RED}
border-color=${RED}
default-timeout=0
on-notify=exec ~/.config/sway/scripts/sound notify-critical

# Scripts that play their own sound send their notifications as "sway-quiet"
[app-name="sway-quiet"]
on-notify=none

# Game mode and the pomodoro break: makoctl mode -a/-r do-not-disturb
[mode=do-not-disturb]
invisible=1
on-notify=none
