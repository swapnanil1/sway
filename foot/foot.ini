# foot. Colours are included from colors.ini, written by ~/.config/sway/scripts/theme.
# foot reads this at start, so a theme change shows in new windows.
include=~/.config/foot/colors.ini

[main]
font=JetBrainsMono Nerd Font:size=13
dpi-aware=no
pad=10x10
resize-by-cells=yes
resize-keep-grid=yes
bold-text-in-bright=no
app-id=foot
title=foot
box-drawings-uses-font-glyphs=no

[scrollback]
lines=10000
multiplier=3.0
indicator-format=" ↑ %d "

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[cursor]
style=block
blink=yes
blink-rate=750
unfocused-style=hollow

[bell]
visual=yes
urgent=yes
notify=no

[url]
launch=xdg-open ${url}
osc8-underline=url-mode
label-letters=asdfjklqwer

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
search-start=Control+Shift+r
unicode-input=Control+Shift+u
show-urls-launch=Control+Shift+o
show-urls-copy=none
pipe-command-output=[wl-copy] none

[search-bindings]
cancel=Control+g Escape
commit=Return
find-prev=Control+r
find-next=Control+s
