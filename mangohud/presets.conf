# Views, one per number, from least to most detail. Shift_R + ] cycles them in
# the order set by `preset=` in MangoHud.conf; a game starts with the first one.
# Only HUD items belong here; style, colours and keys are in MangoHud.conf and
# apply to every view. Built-in 0 is "off"; 1-4 are redefined here.
#
#   0 off   1 fps   2 temps   3 compact   4 full   5 bench   6 power   7 everything

[preset 1]
# fps: the frame rate alone, bigger, almost no backdrop
font_size=26
background_alpha=0.3
fps

[preset 2]
# temps: GPU and CPU load with their temperature, and the frame rate
gpu_stats
gpu_temp
cpu_stats
cpu_temp
fps

[preset 3]
# compact: the everyday view
gpu_stats
gpu_temp
gpu_power
vram
cpu_stats
cpu_temp
ram
fps
fps_metrics=avg,0.01
frametime
frame_timing

[preset 4]
# full: everything, for when something needs looking into
gpu_stats
gpu_name
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_fan
gpu_voltage
vram
throttling_status
cpu_stats
cpu_temp
cpu_power
cpu_mhz
ram
swap
fps
fps_metrics=avg,0.01
frametime
frame_timing
engine_version
vulkan_driver
wine
winesync
present_mode
resolution
refresh_rate
display_server
time

[preset 5]
# bench: frame rate with average, 1% and 0.1% lows, frametime and its graph
fps
fps_metrics=avg,0.01,0.001
frametime
frame_timing
time

[preset 6]
# power: clocks, power draw, fan, voltage and throttling, for tuning
gpu_stats
gpu_temp
gpu_junction_temp
gpu_power
gpu_core_clock
gpu_mem_clock
gpu_fan
gpu_voltage
throttling_status
cpu_stats
cpu_temp
cpu_power
cpu_mhz

[preset 7]
# everything: every text readout MangoHud has for a desktop machine. No graphs,
# nothing battery or laptop related, no gamescope-only items (fsr, hdr, debug),
# no FCAT stripes and no exec. Needs a wide screen; this is the view for
# finding out what a value is called before putting it in a smaller preset.
gpu_stats
gpu_name
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_power_limit
gpu_fan
gpu_voltage
gpu_efficiency
vram
proc_vram
throttling_status
cpu_stats
cpu_temp
cpu_power
cpu_mhz
cpu_efficiency
core_load
core_type
ram
swap
procmem
procmem_shared
procmem_virt
io_read
io_write
fps
fps_metrics=avg,0.01,0.001
frame_count
show_fps_limit
frametime
flip_efficiency
engine_version
vulkan_driver
wine
winesync
exec_name
present_mode
gamemode
vkbasalt
resolution
refresh_rate
display_server
network
media_player
media_player_name=spotify
arch
version
time
